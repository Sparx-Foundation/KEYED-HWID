[package]
name = "keyed-hwid"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Privacy-preserving hardware ids from keyed per-property digests"
repository = "https://github.com/Sparx-Foundation/KEYED-HWID"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["hwid", "fingerprint", "privacy", "clone-detection", "hmac"]
categories = ["cryptography", "authentication"]

[dependencies]
base64 = "0.23"
hkdf = "0.13"
hmac = "0.13.0"
semver = "1"
serde = { version = "1", features = ["derive"], optional = true }
sha2 = "0.11"
thiserror = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[features]
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
